<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eef0fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f1d" media="(prefers-color-scheme: dark)" />
    <script>
      // Applies a saved Light/Dark override before first paint; no saved value follows the system.
      try { document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem('color-scheme') || 'light dark'; } catch {}
    </script>
    <title>LinkBoard</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/linkboardlogo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Sora is only the LinkBoard wordmark; UI text uses the system stack. -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
